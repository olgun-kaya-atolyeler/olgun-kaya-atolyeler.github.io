<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dizi kadranı</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(720px,100% - 32px);margin:64px auto 96px}
</style><style>
.iso{--kd-acc:#070707;--kd-acc-text:#cfcfcf;--kd-in:#2a2a2a;--kd-tonic:#3a3a3a;--kd-tape:#181818;--kd-disc:#202020}
.iso[data-theme="light"]{--kd-acc:#34343a;--kd-acc-text:#f4f4f1;--kd-in:#ffffff;--kd-tonic:#ffffff;--kd-tape:#f4f4f1;--kd-disc:#ededea}
.kd-sector{fill:var(--anatomy-top);stroke:none}
.kd-sector.kd-acc{fill:var(--kd-acc)}
.kd-sector.kd-in:not(.kd-acc){fill:var(--kd-in)}
.kd-sector.kd-mark{fill:var(--kd-tonic)}
.kd-label-acc .iso-face-text{fill:var(--kd-acc-text)}
.kd-disc{fill:var(--kd-disc)}
.kd-win.kd-lit{stroke-width:1.4px}
.kd-pointer{fill:var(--anatomy-lit);stroke-width:1px}
.iso-stage{touch-action:none;cursor:grab;outline:none}
.iso-stage:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:6px}
.kd-panel{display:grid;gap:10px;margin:14px auto 0;max-width:640px}
.kd-lesson{box-shadow:0 0 0 1px var(--anatomy-mid);padding:14px 16px 12px;display:grid;gap:8px;background:var(--anatomy-card)}
.kd-lesson-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.kd-lesson-title{font:600 12px/1.4 var(--anatomy-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--anatomy-strong)}
.kd-dots{display:flex;gap:6px}
.kd-dot{width:10px;height:10px;padding:0!important;min-width:0!important;border-radius:50%!important;box-shadow:0 0 0 1px var(--anatomy-mid)!important;background:transparent;cursor:pointer;border:0}
.kd-dot[aria-current="true"]{background:var(--anatomy-hi)!important}
.kd-lesson-text{font-size:14px;line-height:1.6;color:var(--anatomy-text);max-width:62ch}
.kd-lesson-text p{margin:0 0 8px}
.kd-lesson-text b{color:var(--anatomy-strong);font-weight:600}
.kd-tip{font-size:12.5px;color:var(--anatomy-muted)}
.kd-lesson-nav{display:flex;justify-content:space-between}
.kd-row{display:flex;flex-wrap:wrap;gap:5px;align-items:center;justify-content:center}
.kd-row[hidden]{display:none}
.kd-lab{font:10.5px var(--anatomy-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--anatomy-muted);margin-right:4px}
.kd-panel button{font:11px/1.15 var(--anatomy-mono);letter-spacing:.03em;color:var(--anatomy-text);background:transparent;border:0;box-shadow:0 0 0 1px var(--anatomy-faint);padding:7px 9px;min-width:34px;cursor:pointer;border-radius:0}
.kd-panel button:hover:not(:disabled){box-shadow:0 0 0 1px var(--anatomy-mid);color:var(--anatomy-strong)}
.kd-panel button[aria-pressed="true"]{box-shadow:0 0 0 1px var(--anatomy-hi);color:var(--anatomy-strong);background:var(--anatomy-face)}
.kd-panel button:disabled{opacity:.35;cursor:default}
.kd-panel button:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:3px}
.kd-play{min-width:120px!important;padding:9px 14px!important}
.kd-tape{background:var(--kd-tape);box-shadow:0 0 0 1px var(--anatomy-faint);padding:10px 12px 8px;min-height:58px}
.kd-empty{margin:6px 0;font:12px/1.5 var(--anatomy-mono);color:var(--anatomy-muted);text-align:center}
.kd-notes{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:2px}
.kd-notes li{display:grid;justify-items:center;align-content:start;gap:2px;font:12px/1.2 var(--anatomy-mono);color:var(--anatomy-text);position:relative;padding-bottom:16px}
.kd-notes b{font-size:14px;color:var(--anatomy-strong);font-weight:600}
.kd-deg{font-size:10px;color:var(--anatomy-muted)}
.kd-en{font-size:10px;color:var(--anatomy-muted)}
.kd-step{position:absolute;right:-6px;bottom:0;font-size:10px;color:var(--anatomy-mid);transform:translateX(50%)}
.kd-theme{display:inline-flex;gap:5px}
.iso[data-proj]{--anatomy-weight:1.05px;--anatomy-mid:#5c5c61;--anatomy-lo:#85858a;--anatomy-faint:#b0b0b4;--anatomy-text:#2c2c30;--anatomy-muted:#55555a}
.iso[data-proj] .iso-plate-corner{font-size:12px}
.iso[data-proj] .kd-lesson-text{font-size:17px}
.iso[data-proj] .kd-notes b{font-size:17px}
@media (max-width:560px){.iso-plate-corner[data-corner="hint"]{display:none}.iso-plate-corner[data-corner="readout"]{white-space:normal;text-align:right;max-width:100%}.kd-notes{grid-template-columns:repeat(4,minmax(0,1fr));row-gap:8px}.kd-notes li{padding-bottom:0}.kd-step{position:static;transform:none}.kd-step::before{content:"→ "}.kd-panel button{padding:7px 6px}}

    html += faceTextSvg(flatText([x + 1.4, y + 1.4], top), String(i + 1), { size: 5.6, tone: i === S.start ? "hi" : "mid", anchor: "middle" });
    const next = i < 6 ? pat[i + 1] : 12, step = next - pat[i];
    const mid = PHI0 + a + ((pat[i] + step / 2) * Math.PI) / 6;
    const [mx, my] = polar(mid, 43, top);
    html += faceTextSvg(flatText([mx + 1.5, my + 1.5], top), step === 1 ? "Y" : step === 2 ? "T" : "1½", { size: 6.4, tone: "hi", anchor: "middle" });
  }
  // the start pointer: a wedge on the rim at the tonic hole
  {
    const c = PHI0 + a + (pat[S.start] * Math.PI) / 6;
    const tip = iso(polar(c, WIN_OUT + 0.6, top), P), l = iso(polar(c - 0.045, DISC_R - 0.8, top), P), r = iso(polar(c + 0.045, DISC_R - 0.8, top), P);
    html += '<path class="iso-line kd-pointer" data-tone="lit" d="' + pathOfPts([l, tip, r]) + '"/>';
  }
  // the knob, with a line that points at hole 1
  html += solidSvg(cylinder(0, 0, KNOB_R, top, KNOB_TOP - top - 2, P, 64, 0.6), { tone: "mid" });
  html += lineSvg(knurl(0, 0, KNOB_R, top + 1, KNOB_TOP - 2, 64, P), { tone: "lo" });
  html += solidSvg(cylinder(0, 0, KNOB_R - 3, KNOB_TOP - 2, 2, P, 48, 0.4), { tone: "mid" });
  const p0 = iso(polar(PHI0 + a, 0, KNOB_TOP), P), p1 = iso(polar(PHI0 + a, KNOB_R - 3, KNOB_TOP), P);
  html += '<path class="iso-line" data-tone="hi" d="M' + F2(p0[0]) + " " + F2(p0[1]) + "L" + F2(p1[0]) + " " + F2(p1[1]) + '"/>';
  html += dotsSvg([iso([0, 0, KNOB_TOP], P)], { size: 0.6, tone: "hi" });
  discEl.innerHTML = html;
  discEl.style.opacity = String(Math.max(0, 1 - lift * 1.15));
}

function shade() {
  // dial sectors that show through a window are marked; the tonic's sector is lit
  const pc0 = holePc0(), pat = DISCS[S.disc].pat;
  const inScale = new Set(pat.map((p) => (pc0 + p) % 12));
  sectors.forEach((el, pc) => { el.classList.toggle("kd-in", lift < 0.5 && inScale.has(pc)); el.classList.toggle("kd-tonic", lift < 0.5 && pc === S.tonic); el.classList.toggle("kd-mark", S.mark.includes(pc)); });
}

function describe() {
  const { pat, notes } = scale();
  const accs = notes.filter((n) => n.acc !== 0);
  const kind = accs.length === 0 ? "diyez/bemol yok" : accs.every((n) => n.acc > 0) ? accs.length + " diyez: " + accs.map(tr).join(" ") : accs.every((n) => n.acc < 0) ? accs.length + " bemol: " + accs.map(tr).join(" ") : accs.map(tr).join(" ");
  readout.textContent = S.lifted ? "12 ses · yarım ses = bir dilim, tam ses = iki dilim" : tr(notes[0]) + " " + modeName() + " · " + kind;
  stage.setAttribute("aria-valuetext", S.lifted ? "disk kaldırıldı" : tr(notes[0]) + " " + modeName() + ": " + notes.map(tr).join(", "));
  const steps = pat.map((p, i) => (i < 6 ? pat[i + 1] : 12) - p);
  const stepName = (s) => (s === 1 ? "Y" : s === 2 ? "T" : "1½");
  tape.innerHTML = S.lifted ? '<p class="kd-empty">Disk kaldırıldı: kadranda on iki sesin hepsi görünüyor. Bir dilime tıkla, sesini duy.</p>' :
    '<ol class="kd-notes">' + [...notes, notes[0]].map((n, i) => '<li><span class="kd-deg">' + (i + 1) + "</span><b>" + tr(n) + '</b><span class="kd-en">' + en(n) + "</span>" + (i < 7 ? '<span class="kd-step">' + stepName(steps[i]) + "</span>" : "") + "</li>").join("") + "</ol>";
  document.querySelectorAll("[data-tonic]").forEach((b) => b.setAttribute("aria-pressed", String(+b.dataset.tonic === S.tonic)));
  document.querySelectorAll("[data-start]").forEach((b) => b.setAttribute("aria-pressed", String(+b.dataset.start === S.start && S.disc === "major")));
  document.querySelectorAll("[data-disc]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.disc === S.disc)));
  document.querySelectorAll("[data-rel]").forEach((b) => b.setAttribute("aria-pressed", String((b.dataset.rel === "minor") === (S.start === 5))));
  dirty = true; run();
}

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  // the disc turns the short way round to its new place
  let t = targetAngle();
  while (t - angle > Math.PI) t -= 2 * Math.PI;
  while (angle - t > Math.PI) t += 2 * Math.PI;
  const calm = still.matches;
  const na = calm ? t : angle + (t - angle) * (1 - Math.exp(-dt / 0.2));
  const nl = calm ? S.lifted : lift + (S.lifted - lift) * (1 - Math.exp(-dt / 0.22));
  let moving = Math.abs(na - t) > 1e-4 || Math.abs(nl - S.lifted) > 1e-3;
  angle = moving ? na : t; lift = moving ? nl : S.lifted;
  angle = ((angle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
  for (let i = 0; i < 7; i++) if (S.flash[i] > 0) { S.flash[i] = Math.max(0, S.flash[i] - dt / 0.3); moving = true; }
  if (moving || dirty) { drawDisc(); shade(); dirty = false; }
  frame = visible && moving ? requestAnimationFrame(tick) : 0;
}
const run = () => { if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); } };
new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) { dirty = true; run(); } }, { rootMargin: "120px 0px" }).observe(stage);

// ---------- sound: a soft bell-like tone ----------
let audio = null;
function ctx() { if (!audio) { const c = new (window.AudioContext || window.webkitAudioContext)(); const g = c.createGain(); g.gain.value = 0.22; g.connect(c.destination); audio = { c, g }; } audio.c.resume(); return audio; }
function note(semis, when) {
  const { c, g } = ctx();
  const f = 261.63 * Math.pow(2, semis / 12);
  [[1, 1, 1.4], [2, 0.25, 0.5], [3, 0.08, 0.25]].forEach(([r, a, tau]) => {
    const o = c.createOscillator(), e = c.createGain();
    o.frequency.value = f * r;
    e.gain.setValueAtTime(0, when); e.gain.linearRampToValueAtTime(a, when + 0.006); e.gain.setTargetAtTime(0, when + 0.006, tau / 3);
    o.connect(e).connect(g); o.start(when); o.stop(when + tau * 2.5);
  });
}
let timers = [];
function playScale() {
  if (S.lifted) return;
  timers.forEach(clearTimeout); timers = [];
  const { c } = ctx(), t0 = c.currentTime + 0.05;
  const base = DISCS[S.disc].pat;
  const { pat } = scale();
  [...pat, 12].forEach((p, i) => {
    note(S.tonic + p, t0 + i * 0.36);
    const hole = (S.start + (i % 7)) % 7;
    timers.push(setTimeout(() => { S.flash[hole] = 1; run(); }, 50 + i * 360));
  });
}
const playPc = (pc) => { const { c } = ctx(); note(pc, c.currentTime + 0.02); S.mark = [pc]; dirty = true; run(); setTimeout(() => { S.mark = []; dirty = true; run(); }, 400); };

// ---------- pointer: drag turns the disc, a tap plays the sector under it ----------
function floorPoint(e) {
  const box = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal;
  const sx = ((e.clientX - box.left) / box.width) * vb.width, sy = ((e.clientY - box.top) / box.height) * vb.height;
  const a = (45 * Math.PI) / 180, el = (50 * Math.PI) / 180, kk = P.scale * Math.sqrt(1.6);
  const u = (sx - P.origin[0]) / kk, v = ((sy - P.origin[1]) / kk + DIAL_TOP * Math.cos(el)) / Math.sin(el);
  // u = x sinA − y cosA, v = x cosA + y sinA
  return [u * Math.sin(a) + v * Math.cos(a), -u * Math.cos(a) + v * Math.sin(a)];
}
const pcAt = ([x, y]) => { const phi = Math.atan2(x, -y); return ((Math.round(((phi - PHI0) * 6) / Math.PI) % 12) + 12) % 12; };
let drag = null;
stage.addEventListener("pointerdown", (e) => { const p = floorPoint(e); drag = { p, moved: false, r: Math.hypot(p[0], p[1]) }; stage.setPointerCapture?.(e.pointerId); });
stage.addEventListener("pointermove", (e) => {
  if (!drag || S.lifted || !controlsOn("tonic")) return;
  const p = floorPoint(e);
  if (Math.hypot(p[0] - drag.p[0], p[1] - drag.p[1]) > 8) drag.moved = true;
  if (drag.moved) {
    const d = ((pcAt(p) - pcAt(drag.p)) % 12 + 12) % 12;
    if (d) { setTonic((S.tonic + d) % 12); drag.p = p; }
  }
});
stage.addEventListener("pointerup", (e) => { if (drag && !drag.moved && drag.r < 96 && drag.r > 46) playPc(pcAt(floorPoint(e))); drag = null; });
stage.addEventListener("pointercancel", () => (drag = null));
stage.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" && controlsOn("tonic")) setTonic((S.tonic + 1) % 12);
  else if (e.key === "ArrowLeft" && controlsOn("tonic")) setTonic((S.tonic + 11) % 12);
  else if (e.key === " " || e.key === "Enter") playScale();
  else return;
  e.preventDefault();
});
function setTonic(t) { S.tonic = t; describe(); }

// ---------- lesson flow ----------
const LESSON = [{"title":"On iki ses","text":"<p>Kadrandaki on iki dilim, bir oktavın içindeki on iki sesin hepsi. Koyu dilimler piyanonun siyah tuşları. Bir dilime tıkla, sesini duy.</p><p>Yan yana iki dilim arası <b>yarım ses (Y)</b>, bir dilim atlayınca <b>tam ses (T)</b>. Mi ile Fa, Si ile Do arasında siyah tuş yok; o yüzden bu iki beyaz tuş çifti arası yarım sestir.</p><p>Daire, Si'den sonra yeniden Do'ya döner: on iki adım yürüyünce bir oktav yukarıdaki aynı sese varırız.</p>","show":[],"state":{"lifted":1,"disc":"major","start":0,"tonic":0}},{"title":"Majör kalıbı","text":"<p>Disk yedi delikli. Delikler arasındaki adımlar diskin üstünde yazılı: <b>T T Y T T T Y</b>. Bu, majör dizinin kalıbı.</p><p>Disk Do'dayken (1 numaralı delik Do'nun üstünde) deliklerden <b>Do Re Mi Fa Sol La Si</b> görünür: piyanodaki beyaz tuşların hepsi, hiç siyah tuş yok. “Diziyi çal”a bas, her delik sırayla parlar.</p>","show":["play"],"state":{"lifted":0,"disc":"major","start":0,"tonic":0}},{"title":"Kalıbı çevir: başka tonlar","text":"<p>Kalıbı hiç değiştirmeden diski çevirirsek aynı adımlar başka bir sesten başlar. Disk şimdi <b>Sol</b>'de: deliklerden birinde koyu bir dilim belirdi, <b>Fa♯</b>. Sol majörün bir diyezi var.</p><p>Diski Re'ye çevir: iki koyu dilim, Fa♯ ve Do♯. Fa'ya çevir: bu kez Si♭. Bir dizinin hangi diyez ve bemolleri istediğini disk kendisi gösterir. Kalıbı başka bir sese taşımaya <b>aktarım (transpozisyon)</b> denir.</p><p class='kd-tip'>Diski sürükleyerek ya da ton düğmeleriyle çevirebilirsin.</p>","show":["tonic","play"],"state":{"lifted":0,"disc":"major","start":0,"tonic":7}},{"title":"Aynı delikler, minör","text":"<p>Disk Do'da duruyor ama ok bu kez <b>6 numaralı delikte</b>: dizi La'dan başlıyor. Delikler aynı, sesler aynı (yine yalnız beyaz tuşlar), ama başlangıç sesi değişti ve dizi bambaşka duyulur: <b>La doğal minör</b>.</p><p>Adımlar artık <b>T Y T T Y T T</b>. Do majör ile La minör aynı sesleri paylaşır; böyle iki tona <b>ilgili (akraba) ton</b> denir. Her majörün altıncı sesinden başlayan bir ilgili minörü vardır.</p><p class='kd-tip'>Majör ile minör arasında geçip dinle; sonra diski başka bir tona çevir.</p>","show":["rel","tonic","play"],"state":{"lifted":0,"disc":"major","start":5,"tonic":9}},{"title":"Başka deliklerden başlamak: modlar","text":"<p>Ok yalnız 1. ve 6. deliğe değil, herhangi bir deliğe konabilir. Her başlangıç kendine özgü bir renk verir; bunlara <b>mod</b> denir: 2. delik <b>Dor</b>, 3. <b>Frig</b>, 4. <b>Lidya</b>, 5. <b>Miksolidya</b>, 7. <b>Lokriyen</b>. 1. delik majörün, 6. delik doğal minörün eski adlarıyla İyon ve Eol'dür.</p><p>Disk yerinden oynamadığı için sesler hep aynı kalır; değişen yalnızca hangi sesin “ev” olduğudur.</p>","show":["start","tonic","play"],"state":{"lifted":0,"disc":"major","start":1,"tonic":2}},{"title":"Başka bir disk: armonik ve melodik minör","text":"<p>Doğal minörün 7. sesi toniğe tam ses uzaktır; dizi sonunda eve “çekilmez”. <b>Armonik minör</b> diskinde 7. delik yarım ses kaydırılmış: 7. ses artık toniğin hemen altında, bir <b>yeden</b>. Bedeli, 6. ile 7. delik arasında açılan <b>bir buçuk seslik (1½)</b> boşluk.</p><p><b>Melodik minör</b> diski bu boşluğu kapatmak için 6. deliği de kaydırır. Bu biçim çıkarken kullanılır; inerken çoğunlukla doğal minöre dönülür.</p><p class='kd-tip'>Diski değiştir: kalıp değişir, ton aynı kalır.</p>","show":["disc","tonic","play"],"state":{"lifted":0,"disc":"harmonic","start":0,"tonic":9}},{"title":"Serbest","text":"<p>Bütün düğmeler açık. Bir ton seç, okun yerini ya da diski değiştir, dinle. Aşağıdaki şerit seçtiğin dizinin seslerini doğru yazımıyla gösterir: her harf bir kez kullanılır, bu yüzden Re majörde yükseltilmiş Fa “Sol♭” değil <b>Fa♯</b> yazılır.</p>","show":["tonic","rel","start","disc","play"],"state":{"lifted":0,"disc":"major","start":0,"tonic":2}}];

const lesson = document.querySelector("[data-lesson]");
const groups = { tonic: document.querySelector('[data-group="tonic"]'), rel: document.querySelector('[data-group="rel"]'), start: document.querySelector('[data-group="start"]'), disc: document.querySelector('[data-group="disc"]'), play: document.querySelector('[data-group="play"]') };
let stepIndex = 0;
const controlsOn = (name) => !groups[name].hidden;
function enter(i) {
  stepIndex = i;
  const st = LESSON[i];
  Object.entries(groups).forEach(([name, el]) => (el.hidden = !st.show.includes(name)));
  Object.assign(S, st.state);
  lesson.querySelector("[data-step-title]").textContent = (i + 1) + " / " + LESSON.length + " · " + st.title;
  lesson.querySelector("[data-step-text]").innerHTML = st.text;
  lesson.querySelector("[data-prev]").disabled = i === 0;

}
lesson.querySelector("[data-prev]").addEventListener("click", () => enter(Math.max(0, stepIndex - 1)));
lesson.querySelector("[data-next]").addEventListener("click", () => enter(Math.min(LESSON.length - 1, stepIndex + 1)));
lesson.querySelectorAll("[data-dot]").forEach((d, j) => d.addEventListener("click", () => enter(j)));
document.querySelectorAll("[data-tonic]").forEach((b) => b.addEventListener("click", () => setTonic(+b.dataset.tonic)));
document.querySelectorAll("[data-start]").forEach((b) => b.addEventListener("click", () => {
  // keep the disc where it is and move the pointer: the tonic becomes the sound under the chosen hole
  const pc0 = holePc0(); S.disc = "major"; S.start = +b.dataset.start; S.tonic = (pc0 + DISCS.major.pat[S.start]) % 12; describe();
}));
document.querySelectorAll("[data-rel]").forEach((b) => b.addEventListener("click", () => {
  const pc0 = holePc0(); S.disc = "major"; S.start = b.dataset.rel === "minor" ? 5 : 0; S.tonic = (pc0 + DISCS.major.pat[S.start]) % 12; describe();
}));
document.querySelectorAll("[data-disc]").forEach((b) => b.addEventListener("click", () => {
  if (S.disc === b.dataset.disc) return;
  // lift, swap, put back: the tonic stays, the holes change
  S.lifted = 1; S.start = 0; describe();
  setTimeout(() => { S.disc = b.dataset.disc; describe(); setTimeout(() => { S.lifted = 0; describe(); }, 260); }, 380);
}));
document.querySelectorAll("[data-play]").forEach((b) => b.addEventListener("click", playScale));

const ROOT = document.querySelector(".iso");
document.querySelectorAll("[data-theme-pick]").forEach((b) => b.addEventListener("click", () => {
  const pick = b.dataset.themePick;
  ROOT.dataset.theme = pick === "dark" ? "dark" : "light";
  ROOT.toggleAttribute("data-proj", pick === "proj");
  ROOT.style.colorScheme = pick === "dark" ? "dark" : "light";

  try { localStorage.setItem("kadran-theme", pick); } catch (e) {}
}));
{
  let pick = null;
  try { pick = (localStorage.getItem("kadran-theme") || localStorage.getItem("mt-tema")); } catch (e) {}
  if (!pick) pick = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  document.querySelector('[data-theme-pick="' + pick + '"]')?.click();
}
angle = targetAngle(); lift = 1;
enter(0);
